[project]
name = "ultron"
version = "0.7.1"
description = "ULTRON GENESIS local Windows AI assistant"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "moonshine-voice>=0.1.5",
    "numpy>=2.3.0",
    "piper-tts>=1.8.0",
    "pyautogui>=0.9.54",
    "pyopengl>=3.1.10",
    "pyside6>=6.11.2",
    "pillow>=11.0.0",
    "requests>=2.34.2",
    "sounddevice>=0.5.6",
]

[project.optional-dependencies]
windows = ["pywinauto>=0.6.9"]
browser = ["playwright>=1.50.0"]
agents = ["mcp>=2.2.0", "a2a-sdk>=1.1.5", "langgraph>=1.2.12", "pydantic-ai>=2.51.0"]
models = ["huggingface-hub>=1.32.0"]
voice = ["silero-vad>=6.2.0"]
runtime = [
    "pywinauto>=0.6.9",
    "playwright>=1.50.0",
    "mcp>=2.2.0",
    "a2a-sdk>=1.1.5",
    "langgraph>=1.2.12",
    "pydantic-ai>=2.51.0",
    "huggingface-hub>=1.32.0",
    "silero-vad>=6.2.0",
]
all = [
    "pywinauto>=0.6.9",
    "playwright>=1.50.0",
    "mcp>=2.2.0",
    "a2a-sdk>=1.1.5",
    "langgraph>=1.2.12",
    "pydantic-ai>=2.51.0",
    "huggingface-hub>=1.32.0",
    "silero-vad>=6.2.0",
]
